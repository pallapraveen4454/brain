<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainQuizAI - Password Reset</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0F0913 0%, #1A0B2E 50%, #12002B 100%);
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .container {
            max-width: 440px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 36px 28px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #7C4DFF 0%, #B388FF 100%);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 20px;
            box-shadow: 0 8px 16px rgba(124, 77, 255, 0.3);
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #FFFFFF 0%, #E0E0E0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.5;
            margin-bottom: 28px;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #7C4DFF 0%, #651FFF 100%);
            color: #FFFFFF;
            font-weight: 600;
            font-size: 16px;
            text-decoration: none;
            border-radius: 14px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(124, 77, 255, 0.4);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(124, 77, 255, 0.5);
        }
        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🧠</div>
        <h1>BrainQuizAI</h1>
        <p id="message">Password reset or authorization flow detected. Please open the link in the BrainQuizAI mobile app.</p>
        <a id="app-button" href="brainquizai://reset-password" class="btn">Open BrainQuizAI App</a>
        <div class="footer">&copy; BrainQuizAI. All rights reserved.</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const oobCode = urlParams.get('oobCode');
        const mode = urlParams.get('mode');

        if (oobCode) {
            const appUrl = `brainquizai://reset-password?oobCode=${encodeURIComponent(oobCode)}&mode=${encodeURIComponent(mode || 'resetPassword')}`;
            document.getElementById('app-button').setAttribute('href', appUrl);
            
            // Auto redirect to deep link on mobile browsers
            window.location.href = appUrl;
        }
    </script>
</body>
</html>
