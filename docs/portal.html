<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainQuizAI - Official Legal & Support Portal</title>
    <style>
        :root {
            --primary: #7C4DFF;
            --primary-dark: #651FFF;
            --primary-light: #B388FF;
            --bg: #0F0913;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #F3F0F7;
            --text-muted: #B3A8C2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0F0913 0%, #1A0B2E 50%, #12002B 100%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 44px 36px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .logo {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 20px;
            box-shadow: 0 10px 24px rgba(124, 77, 255, 0.4);
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #FFFFFF 0%, #E0D4FC 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        p {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 30px;
        }

        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            color: #FFFFFF;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.2s;
        }

        .link-card:hover {
            background: rgba(124, 77, 255, 0.15);
            border-color: rgba(124, 77, 255, 0.4);
            transform: translateY(-2px);
        }

        .link-card span.icon {
            font-size: 22px;
            margin-right: 12px;
        }

        .link-left {
            display: flex;
            align-items: center;
        }

        .footer {
            margin-top: 36px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🧠</div>
        <h1>BrainQuizAI</h1>
        <p>Official Legal Documents & Account Management Portal</p>

        <div class="links-grid">
            <a href="privacy.html" class="link-card">
                <div class="link-left">
                    <span class="icon">🔒</span>
                    <span>Privacy Policy</span>
                </div>
                <span>&rarr;</span>
            </a>
            <a href="terms.html" class="link-card">
                <div class="link-left">
                    <span class="icon">📜</span>
                    <span>Terms & Conditions</span>
                </div>
                <span>&rarr;</span>
            </a>
            <a href="delete-account.html" class="link-card">
                <div class="link-left">
                    <span class="icon">🗑️</span>
                    <span>Delete Account Request</span>
                </div>
                <span>&rarr;</span>
            </a>
            <a href="support.html" class="link-card">
                <div class="link-left">
                    <span class="icon">💬</span>
                    <span>Help & Support</span>
                </div>
                <span>&rarr;</span>
            </a>
        </div>

        <div class="footer">
            &copy; 2026 BrainQuizAI. Contact: <a href="mailto:pallapraveen4454@gmail.com" style="color: var(--primary-light);">pallapraveen4454@gmail.com</a>
        </div>
    </div>
</body>
</html>
